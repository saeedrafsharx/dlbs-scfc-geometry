[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlbs-scfc-geometry"
version = "0.1.0"
description = "Reproducible analysis of cortical geometry and structure-function coupling in the Dallas Lifespan Brain Study"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "nibabel",
    "nilearn",
    "dipy",
    "tqdm",
]
